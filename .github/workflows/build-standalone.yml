name: Build standalone car-test APK
on:
  push:
    branches: [lynk-osn-wireless]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore accessory identity from secrets
        env:
          DIPLAY_IDENTITY_PK8_B64: ${{ secrets.DIPLAY_IDENTITY_PK8_B64 }}
          DIPLAY_CERTIFICATE_P7B_B64: ${{ secrets.DIPLAY_CERTIFICATE_P7B_B64 }}
        run: |
          mkdir -p /tmp/diplay-auth/offline-mfi
          printf '%s' "$DIPLAY_IDENTITY_PK8_B64" | base64 -d > /tmp/diplay-auth/offline-mfi/identity.pk8
          printf '%s' "$DIPLAY_CERTIFICATE_P7B_B64" | base64 -d > /tmp/diplay-auth/offline-mfi/certificate.p7b
          ls -la /tmp/diplay-auth/offline-mfi/
      - name: Restore stable debug keystore from secrets
        env:
          DIPLAY_DEBUG_KEYSTORE_B64: ${{ secrets.DIPLAY_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DIPLAY_DEBUG_KEYSTORE_B64" ]; then
            echo "DIPLAY_DEBUG_KEYSTORE_B64 secret is missing; refusing to build with a random debug key." >&2
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$DIPLAY_DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          ls -la ~/.android/debug.keystore
      - name: Diagnose keystore on runner
        run: |
          echo "HOME=$HOME user=$(whoami)"
          sha256sum ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android 2>&1 | head -8
      - name: Build standalone APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: /tmp/diplay-auth
        run: ./gradlew :mobile:assembleStandaloneDebug --stacktrace
      - name: Verify APK signature uses the stable debug key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found" >&2; exit 1; fi
          FP=$("$APKSIGNER" verify --print-certs mobile/build/outputs/apk/debug/mobile-debug.apk 2>/dev/null | grep -m1 "SHA-256" | awk '{print $NF}')
          echo "APK cert SHA-256: $FP"
          EXPECTED="B1:4F:7D:3D:93:2D:B6:E8:61:49:41:4D:61:AD:0F:E2:69:1A:26:B3:72:8F:99:51:00:37:93:DF:E2:98:CE:2C"
          if [ "$FP" != "$EXPECTED" ]; then
            echo "APK was NOT signed with the stable debug keystore; refusing to publish." >&2
            exit 1
          fi
          echo "Signature OK: stable debug key used."
      - name: Rename APK with version and timestamp
        run: |
          VERSION=$(grep -m1 -oP 'versionName = "\K[^"]+' mobile/build.gradle.kts)
          SUFFIX=$(grep -m1 -oP 'versionNameSuffix = "\K[^"]+' mobile/build.gradle.kts)
          STAMP=$(TZ=Asia/Shanghai date +%y%m%d%H%M)
          SRC=mobile/build/outputs/apk/debug/mobile-debug.apk
          DST=mobile/build/outputs/apk/debug/diplay-${VERSION}${SUFFIX}-${STAMP}.apk
          mv "$SRC" "$DST"
          ls -la mobile/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-lynk-osn-wireless-standalone
          path: mobile/build/outputs/apk/debug/diplay-*.apk
